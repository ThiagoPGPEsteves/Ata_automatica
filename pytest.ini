[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Testes unitários rápidos e isolados (sem I/O pesado, sem rede, sem Ollama)
    integration: Testes de integração entre múltiplos componentes do sistema
    benchmark: Testes de avaliação comparativa e medição de desempenho
    needs_ollama: Testes que requerem uma instância local do Ollama ativa
    needs_audio: Testes que exigem hardware físico de áudio WASAPI disponível

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
